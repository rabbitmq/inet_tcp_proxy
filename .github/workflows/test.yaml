name: Test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp:
        - "26.2"
        - "27"
        - "28"
    steps:
    - name: CHECKOUT
      uses: actions/checkout@v5
    - name: CONFIGURE ERLANG
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
    - name: TEST
      run: make tests
    - name: CAPTURE TEST LOGS ON FAILURE
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: inet_tcp_proxy-logs-${{matrix.otp_version}}
        path: logs/*
